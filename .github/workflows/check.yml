name: Source and synthetic review checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: check-${{ matrix.shard }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned developer dependencies
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -r requirements-dev.txt
          npm ci --ignore-scripts --no-fund --no-audit
      # No actual document, approval, native COM action, or security DLL is used.
      - name: Lint and fixture-only regression checks
        run: npm run check -- --shard=${{ matrix.shard }}
  candidate:
    name: frozen-candidate
    if: github.event_name == 'push' && github.repository == 'mud-the-developer/hwp-editor-public'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.8'
          architecture: x64
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.401'
      - name: Rebuild and self-test a disposable Windows candidate
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt -r requirements-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 scripts/build_exe.py --candidate-only
      # Raw BUILD and machine inventory never leave the disposable runner.
      # The operated Windows host independently builds and tests the bytes it ships.
  docs:
    name: docs-preview
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: node --test scripts/release.test.mjs
      - run: npm run build
        env:
          HWP_DOCS_PREVIEW: historical-rc4
          NEXT_PUBLIC_BASE_PATH: /hwp-editor-public
