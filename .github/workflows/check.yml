name: Source and synthetic review checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: check-${{ matrix.shard }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned developer dependencies
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -r requirements-dev.txt
          npm ci --ignore-scripts --no-fund --no-audit
      # No actual document, approval, native COM action, or security DLL is used.
      - name: Lint and fixture-only regression checks
        run: npm run check -- --shard=${{ matrix.shard }}
