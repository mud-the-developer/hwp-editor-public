name: Deploy Docs to GitHub Pages
run-name: Pages ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published tag (v<APP_VERSION>-build.<first 12 commit digits>)
        type: string
        required: true
      commit:
        description: Full lowercase SHA of the published main commit
        type: string
        required: true

permissions: {}

env:
  HWP_RELEASE_TAG: ${{ inputs.tag }}
  HWP_RELEASE_COMMIT: ${{ inputs.commit }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      metadata_sha256: ${{ steps.identity.outputs.sha256 }}
    steps:
      - name: Require the current public main dispatch before checkout
        run: |
          [[ "$GITHUB_REPOSITORY" == mud-the-developer/hwp-editor-public ]]
          [[ "$GITHUB_REF" == refs/heads/main && "$HWP_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$HWP_RELEASE_COMMIT" ]]

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs dependencies
        working-directory: docs-site
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify the public prerelease and build Fumadocs
        working-directory: docs-site
        env:
          NEXT_PUBLIC_BASE_PATH: /hwp-editor-public
        run: npm run build

      - name: Bind Pages artifact to its verified public metadata
        id: identity
        run: |
          touch docs-site/out/.nojekyll
          echo "sha256=$(sha256sum docs-site/out/release.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs-site/out

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Recheck published metadata and remote main after environment approval
        env:
          HWP_PAGES_METADATA_SHA256: ${{ needs.build.outputs.metadata_sha256 }}
        run: node docs-site/scripts/release.mjs --recheck

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
