<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src blob: data:; connect-src 'self'; font-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>현재 HWPX 로컬 쪽 미리보기</title>
<link rel="stylesheet" href="/viewer.css">
</head>
<body>
<nav aria-label="문서 쪽과 배율">
<button id="previous" type="button" disabled aria-label="이전 쪽" title="이전 쪽">‹</button>
<span id="page-number" role="status" aria-live="polite">쪽 준비 중</span>
<button id="next" type="button" disabled aria-label="다음 쪽" title="다음 쪽">›</button>
<button id="zoom-out" type="button" disabled aria-label="미리보기 축소" title="미리보기 축소">−</button>
<output id="zoom" aria-live="polite" aria-label="미리보기 배율">100%</output>
<button id="zoom-in" type="button" disabled aria-label="미리보기 확대" title="미리보기 확대">+</button>
<button id="fit" type="button" disabled aria-label="문서 너비 맞춤" title="문서 너비 맞춤">너비 맞춤</button>
</nav>
<main id="viewport" tabindex="0" aria-busy="true" aria-label="HWPX 읽기 전용 연속 쪽 미리보기. 위아래로 스크롤하거나 이전·다음 쪽 버튼으로 이동합니다. 본문을 두 번 클릭하면 오른쪽에 수정 메모를 추가합니다."><div id="sheet" aria-label="현재 문서의 쪽"></div></main>
<footer>
<p id="boundary">읽기 전용 · 본문 두 번 클릭 → 수정 메모 · 한컴 배치 검수 아님</p>
<p id="status" role="status" aria-live="polite">로컬 렌더러 준비 중…</p>
</footer>
<script type="module" src="/viewer.js"></script>
</body>
</html>
